[project]
name = "recourse-harness"
version = "0.1.0"
description = "Evaluation harness for Recourse: traces, faults, baselines, RQ drivers, plots"
requires-python = ">=3.12"
dependencies = [
    "recourse-classifier",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "web3>=6.20",
    "httpx>=0.27",
    "pyarrow>=16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.152.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recourse_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
recourse-classifier = { path = "../classifier", editable = true }
