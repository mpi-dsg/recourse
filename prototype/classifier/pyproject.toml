[project]
name = "recourse-classifier"
version = "0.1.0"
description = "Eligibility and settleability predicates for Recourse contracts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "eth-utils>=4.1",
    "eth-typing>=4.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recourse_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
