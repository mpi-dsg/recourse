name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prototype:
    name: Prototype gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"

      - name: Bootstrap prototype
        run: make -C prototype setup

      - name: Run repository gate
        run: make -C prototype test-all
